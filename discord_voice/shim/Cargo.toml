[package]
name = "discord-voice-shim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native transport AEAD shim for discord.mbt"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
