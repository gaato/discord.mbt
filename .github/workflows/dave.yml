name: Dave

# CI for the gaato/dave module in dave/; a `dave-v<version>` tag on a commit
# that passed it publishes the module (release.yml). Its toolchain pin moves
# with the one in ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "dave/**"
      - ".github/workflows/dave.yml"
  pull_request:
    branches: [main]
    paths:
      - "dave/**"
      - ".github/workflows/dave.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dave

# Build gaato/dave on its own, as it is published; it has no dependency on the
# other workspace members.
env:
  MOON_WORK: "off"

jobs:
  unavailable:
    name: Unavailable facade (${{ matrix.target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm]
    env:
      MBT_DAVE_NATIVE_ROOT: /definitely/missing/dave-must-not-bootstrap
      MOONBIT_INSTALL_VERSION: "0.10.15+943464bfa"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://cli.moonbitlang.com/install/unix.sh \
            --output "$RUNNER_TEMP/install-moonbit.sh"
          actual="$(shasum -a 256 "$RUNNER_TEMP/install-moonbit.sh" | awk '{print $1}')"
          test "$actual" = "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Test bounded native-asset downloader
        run: node --test test/build.test.js

      - name: Check packages without native bootstrap
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Test unavailable facade
        run: moon test --target ${{ matrix.target }} --release --deny-warn

  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    env:
      MBT_DAVE_REQUIRE_NATIVE: "1"
      MOONBIT_INSTALL_VERSION: "0.10.15+943464bfa"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://cli.moonbitlang.com/install/unix.sh \
            --output "$RUNNER_TEMP/install-moonbit.sh"
          actual="$(shasum -a 256 "$RUNNER_TEMP/install-moonbit.sh" | awk '{print $1}')"
          test "$actual" = "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "install-moonbit.ps1"
          Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne "a5101e91ffa9905fb25cd009b9a4aa942971a294bd055c89836e3af89b710c64") {
            throw "MoonBit installer SHA-256 mismatch: $actual"
          }
          & $installer
          "$HOME\.moon\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Check native packages
        run: moon check --target native --deny-warn

      - name: Build native packages
        run: moon build --target native --release --deny-warn

      - name: Test against native libdave
        run: moon test --target native --release --deny-warn

      - name: Check format, interface, and package contents
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          moon fmt --check
          moon info --target native
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'
          moon package --list

  macos-intel-bootstrap:
    name: Native asset bootstrap (macos-x64; no official MoonBit toolchain)
    runs-on: macos-26-intel
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify the pinned Intel asset
        shell: bash
        run: |
          output="$(node build.js </dev/null)"
          test "$output" = "{}"
          library="$HOME/Library/Caches/gaato-dave/libdave/v1.2.0-cpp/macos-x64/lib/libdave.dylib"
          test -f "$library"
          file "$library" | grep -q 'x86_64'
