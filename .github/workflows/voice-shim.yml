name: Voice shim

on:
  push:
    branches: [main]
    paths:
      - "voice-shim/**"
      - ".github/workflows/voice-shim.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice-shim/**"
      - ".github/workflows/voice-shim.yml"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: libdiscord_voice_shim-linux-x64.so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: libdiscord_voice_shim-linux-arm64.so
          - runner: macos-13
            target: x86_64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: libdiscord_voice_shim-macos-x64.dylib
          - runner: macos-14
            target: aarch64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: libdiscord_voice_shim-macos-arm64.dylib

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voice-shim/target
          key: voice-shim-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('voice-shim/Cargo.toml') }}

      - name: Build release library
        working-directory: voice-shim
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Rename library
        env:
          TARGET: ${{ matrix.target }}
          BUILT_LIBRARY: ${{ matrix.built_library }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          cp "voice-shim/target/$TARGET/release/$BUILT_LIBRARY" "dist/$ARTIFACT"

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum libdiscord_voice_shim-* > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: voice-shim-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: checksums
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: voice-shim-release
          path: dist

      - name: Attach libraries to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
