name: Voice shim

on:
  push:
    branches: [main]
    paths:
      - "voice-shim/**"
      - "build.js"
      - "release/voice-shim-v0.1.0.js"
      - "moon.mod"
      - "src/voice/shim_stub.c"
      - "test/prebuild.test.js"
      - ".github/workflows/voice-shim.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice-shim/**"
      - "build.js"
      - "release/voice-shim-v0.1.0.js"
      - "moon.mod"
      - "src/voice/shim_stub.c"
      - "test/prebuild.test.js"
      - ".github/workflows/voice-shim.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name == 'voice-shim-v0.1.0'
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MOONBIT_INSTALL_VERSION: "0.10.13+cbb11c36f"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: discord-voice-shim-v0.1.0-linux-x86_64.tar.gz
            archive_format: tar
            moonbit_smoke: true
            runtime_path: voice-shim/target/x86_64-unknown-linux-gnu/release/libdiscord_voice_shim.so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: discord-voice-shim-v0.1.0-linux-aarch64.tar.gz
            archive_format: tar
            moonbit_smoke: true
            runtime_path: voice-shim/target/aarch64-unknown-linux-gnu/release/libdiscord_voice_shim.so
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: discord-voice-shim-v0.1.0-macos-x86_64.tar.gz
            archive_format: tar
            moonbit_smoke: false
            runtime_path: voice-shim/target/x86_64-apple-darwin/release/libdiscord_voice_shim.dylib
          - runner: macos-15
            target: aarch64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: discord-voice-shim-v0.1.0-macos-aarch64.tar.gz
            archive_format: tar
            moonbit_smoke: true
            runtime_path: voice-shim/target/aarch64-apple-darwin/release/libdiscord_voice_shim.dylib
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            built_library: discord_voice_shim.dll
            artifact: discord-voice-shim-v0.1.0-windows-x86_64.zip
            archive_format: zip
            moonbit_smoke: true
            runtime_path: voice-shim/target/x86_64-pc-windows-msvc/release/discord_voice_shim.dll

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voice-shim/target
          key: voice-shim-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('voice-shim/Cargo.toml', 'voice-shim/Cargo.lock') }}

      - name: Check source
        working-directory: voice-shim
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build release library
        working-directory: voice-shim
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke-test the dynamic ABI
        if: runner.os != 'Windows'
        env:
          RUNTIME_PATH: ${{ github.workspace }}/${{ matrix.runtime_path }}
        run: python voice-shim/dynamic_smoke.py "$RUNTIME_PATH"

      - name: Smoke-test the dynamic ABI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILT_RUNTIME_PATH: ${{ github.workspace }}/${{ matrix.runtime_path }}
        run: |
          $runtimePath = Join-Path $env:RUNNER_TEMP "discord_voice_shim.dll"
          Copy-Item -LiteralPath $env:BUILT_RUNTIME_PATH -Destination $runtimePath -Force
          Unblock-File -LiteralPath $runtimePath -ErrorAction SilentlyContinue
          Get-Item -LiteralPath $runtimePath | Format-List FullName,Length
          Get-FileHash -Algorithm SHA256 -LiteralPath $runtimePath
          python voice-shim/dynamic_smoke.py $runtimePath

      - name: Bootstrap the released component
        env:
          DISCORD_VOICE_SHIM_CACHE_DIR: ${{ runner.temp }}/discord-voice-shim-cache
        run: node build.js

      - name: Install MoonBit (Linux and macOS)
        if: matrix.moonbit_smoke && runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://cli.moonbitlang.com/install/unix.sh \
            --output "$RUNNER_TEMP/install-moonbit.sh"
          actual="$(shasum -a 256 "$RUNNER_TEMP/install-moonbit.sh" | awk '{print $1}')"
          test "$actual" = "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: matrix.moonbit_smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "install-moonbit.ps1"
          Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne "a5101e91ffa9905fb25cd009b9a4aa942971a294bd055c89836e3af89b710c64") {
            throw "MoonBit installer SHA-256 mismatch: $actual"
          }
          & $installer
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test MoonBit loader integration
        if: matrix.moonbit_smoke
        env:
          DISCORD_VOICE_REQUIRE_SHIM: "1"
          DISCORD_VOICE_SHIM_CACHE_DIR: ${{ runner.temp }}/discord-voice-shim-cache
        run: |
          moon update
          moon test src/voice/crypto_test.mbt --target native --release --deny-warn

      - name: Stage component contents
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILT_LIBRARY: ${{ matrix.built_library }}
        run: |
          mkdir -p dist/package
          cp "voice-shim/target/$TARGET/release/$BUILT_LIBRARY" "dist/package/$BUILT_LIBRARY"
          cp LICENSE dist/package/LICENSE
          cp voice-shim/THIRD_PARTY.md dist/package/THIRD_PARTY.md
          node voice-shim/package-licenses.js dist/package/THIRD_PARTY_LICENSES

      - name: Create tar archive
        if: matrix.archive_format == 'tar'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: tar -C dist/package -czf "dist/$ARTIFACT" .

      - name: Create zip archive
        if: matrix.archive_format == 'zip'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: Compress-Archive -Path dist/package/* -DestinationPath "dist/$env:ARTIFACT"

      - name: Upload component archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    if: github.event_name != 'release' || github.event.release.tag_name == 'voice-shim-v0.1.0'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        shell: bash
        run: |
          sha256sum discord-voice-shim-* > SHA256SUMS
          stat --format='%s  %n' discord-voice-shim-* > ASSET_SIZES
          : > RUNTIME_SHA256SUMS
          for archive in *.tar.gz; do
            target="${archive%.tar.gz}"
            mkdir "$target"
            tar -xzf "$archive" -C "$target"
            library="$(find "$target" -maxdepth 1 -type f -name 'libdiscord_voice_shim.*' -print -quit)"
            digest="$(sha256sum "$library" | awk '{print $1}')"
            size="$(stat --format='%s' "$library")"
            printf '%s  %s:%s  %s bytes\n' "$digest" "$archive" "$(basename "$library")" "$size" >> RUNTIME_SHA256SUMS
            rm -rf "$target"
          done
          for archive in *.zip; do
            target="${archive%.zip}"
            mkdir "$target"
            unzip -q "$archive" -d "$target"
            library="$(find "$target" -maxdepth 1 -type f -name 'discord_voice_shim.dll' -print -quit)"
            digest="$(sha256sum "$library" | awk '{print $1}')"
            size="$(stat --format='%s' "$library")"
            printf '%s  %s:%s  %s bytes\n' "$digest" "$archive" "$(basename "$library")" "$size" >> RUNTIME_SHA256SUMS
            rm -rf "$target"
          done

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-shim-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.release.tag_name == 'voice-shim-v0.1.0'
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voice-shim-release
          path: dist

      - name: Attach libraries to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
