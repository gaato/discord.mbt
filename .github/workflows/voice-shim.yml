name: Voice shim

on:
  push:
    branches: [main]
    paths:
      - "voice-shim/**"
      - ".github/workflows/voice-shim.yml"
  pull_request:
    branches: [main]
    paths:
      - "voice-shim/**"
      - ".github/workflows/voice-shim.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: libdiscord_voice_shim-linux-x64.so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            built_library: libdiscord_voice_shim.so
            artifact: libdiscord_voice_shim-linux-arm64.so
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: libdiscord_voice_shim-macos-x64.dylib
          - runner: macos-15
            target: aarch64-apple-darwin
            built_library: libdiscord_voice_shim.dylib
            artifact: libdiscord_voice_shim-macos-arm64.dylib
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            built_library: discord_voice_shim.dll
            artifact: libdiscord_voice_shim-windows-x64.dll

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voice-shim/target
          key: voice-shim-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('voice-shim/Cargo.toml', 'voice-shim/Cargo.lock') }}

      - name: Check source
        working-directory: voice-shim
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build release library
        working-directory: voice-shim
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Rename library
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILT_LIBRARY: ${{ matrix.built_library }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          mkdir -p dist
          cp "voice-shim/target/$TARGET/release/$BUILT_LIBRARY" "dist/$ARTIFACT"

      - name: Upload library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum libdiscord_voice_shim-* > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voice-shim-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voice-shim-release
          path: dist

      - name: Attach libraries to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
