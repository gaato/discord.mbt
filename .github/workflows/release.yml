name: Release

# Publishes one module to mooncakes.io when its release tag is pushed:
# `discord-v<version>`, `discord_voice-v<version>`, or `dave-v<version>`.
# The tag must name the version in that module's moon.mod and point at a
# commit on main, which CI has checked. The module is built on its own and
# resolves its dependencies from the registry, as consumers do, so a module
# that needs a new version of another is tagged after that version is
# published. Earlier gaato/discord releases are tagged `v<version>`;
# `voice-shim-v*` tags release the Rust shim (voice-shim.yml).
#
# After the publish, a GitHub Release is created for the tag from that
# version's section of `<module>/CHANGELOG.md`. Only gaato/discord releases are
# marked latest. Run the workflow by hand with a tag to create a missing
# Release for a version already published; that run does not publish.

on:
  push:
    tags:
      - "discord-v*"
      - "discord_voice-v*"
      - "dave-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of a published version, such as discord-v0.8.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MOONBIT_INSTALL_VERSION: "0.10.15+943464bfa"

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.15-943464bfa
    environment: mooncakes
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev

      - name: Check the tag against main and moon.mod
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The container's git sees a checkout owned by another user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          module="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "$module/moon.mod" || { echo "no module directory for $TAG" >&2; exit 1; }
          declared=$(sed -nE 's/^version = "(.*)"$/\1/p' "$module/moon.mod")
          if [ "$declared" != "$version" ]; then
            echo "$TAG names $version, but $module/moon.mod declares $declared" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG points at a commit that is not on main" >&2
            exit 1
          fi
          echo "module=$module" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
          MOONCAKES_USERNAME: ${{ secrets.MOONCAKES_USERNAME }}
          MODULE: ${{ steps.tag.outputs.module }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "MOONCAKES_TOKEN is not set; nothing published" >&2
            exit 1
          fi
          # moon needs credentials even for --dry-run.
          moon_home="${MOON_HOME:-$HOME/.moon}"
          mkdir -p "$moon_home"
          umask 077
          printf '{"token":"%s","username":"%s"}\n' "$MOONCAKES_TOKEN" "$MOONCAKES_USERNAME" > "$moon_home/credentials.json"
          trap 'rm -f "$moon_home/credentials.json"' EXIT
          scripts/release.sh --dry-run "$MODULE"
          scripts/release.sh "$MODULE"

  github-release:
    needs: publish
    # A manual run skips the publish and only creates the Release.
    if: >-
      !cancelled() && (needs.publish.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Create the Release from the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          module="${TAG%-v*}"
          version="${TAG##*-v}"
          case "$module" in
            discord | discord_voice | dave) ;;
            *) echo "$TAG is not a module release tag" >&2; exit 1 ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A Release for $TAG already exists"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          # The section runs from `## [<version>]` to the next `## [` heading.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' "$module/CHANGELOG.md" > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "$module/CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          printf '\nPublished as [gaato/%s@%s](https://mooncakes.io/docs/gaato/%s).\n' \
            "$module" "$version" "$module" >> "$notes"
          latest=false
          if [ "$module" = discord ]; then latest=true; fi
          gh release create "$TAG" --verify-tag --title "gaato/$module $version" \
            --notes-file "$notes" --latest="$latest"
