name: Release

# Publishes to mooncakes.io after a module's CI is green on main: gaato/discord
# and then gaato/discord_voice after CI, gaato/dave after Dave. Idempotent:
# when the version in a moon.mod is already in the registry index nothing
# happens, so only a version bump releases (scripts/release.sh). Modules are
# published in dependency order and resolve their dependencies from the
# registry, as consumers do: a module that needs a new version of another must
# name it in its moon.mod, and that version must be published first. A manual
# run publishes all three: gaato/dave, gaato/discord, then gaato/discord_voice.

on:
  workflow_run:
    workflows: [CI, Dave]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MOONBIT_INSTALL_VERSION: "0.10.15+943464bfa"

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.15-943464bfa
    environment: mooncakes
    steps:
      - name: Check out the commit CI validated
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev

      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
          MOONCAKES_USERNAME: ${{ secrets.MOONCAKES_USERNAME }}
          MODULES: >-
            ${{ github.event_name == 'workflow_dispatch' && 'dave discord discord_voice'
              || github.event.workflow_run.name == 'Dave' && 'dave'
              || 'discord discord_voice' }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "MOONCAKES_TOKEN is not set; nothing published" >&2
            exit 0
          fi
          # moon needs credentials even for --dry-run.
          moon_home="${MOON_HOME:-$HOME/.moon}"
          mkdir -p "$moon_home"
          umask 077
          printf '{"token":"%s","username":"%s"}\n' "$MOONCAKES_TOKEN" "$MOONCAKES_USERNAME" > "$moon_home/credentials.json"
          trap 'rm -f "$moon_home/credentials.json"' EXIT
          for module in $MODULES; do
            scripts/release.sh --dry-run "$module"
            scripts/release.sh "$module"
          done
