name: Canary

# Runs scripts/gates.sh, CI's toolchain-dependent MoonBit gates, on the latest
# and nightly toolchains. When latest breaks, fix it, then bump the pinned image
# and MOONBIT_INSTALL_VERSION in ci.yml, dave.yml, release.yml, and
# voice-shim.yml. unzip extracts the libdave archive for the gaato/dave gate.
# On a toolchain after 0.10.20 the shared workflow first copies
# compat/core_async_next into the tree; the bump past 0.10.20 moves those
# files in for good and deletes compat/.

on:
  schedule:
    # 06:47 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh all
      setup: apt-get update && apt-get install -y --no-install-recommends unzip
      timeout-minutes: 40
