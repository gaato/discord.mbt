name: Canary

# Runs scripts/gates.sh, CI's toolchain-dependent MoonBit gates, on the latest
# and nightly toolchains. When latest breaks, fix it, then move every pin to it:
# moonbit-version, the ghcr.io/gaato/moonbit image tags, and
# MOONBIT_INSTALL_VERSION in the workflows. template/Dockerfile instead moves
# with the gaato/discord release its moon.mod pins. unzip extracts the libdave
# archive for the gaato/dave gate.

on:
  schedule:
    # 06:47 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh all
      setup: apt-get update && apt-get install -y --no-install-recommends unzip
      timeout-minutes: 40
