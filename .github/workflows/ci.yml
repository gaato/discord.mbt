name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job except voice-shim runs in ghcr.io/gaato/moonbit
# (https://github.com/gaato/moonbit-docker), which carries the toolchain and
# Node.js 24, and installs only project runtimes on top; voice-shim builds Rust
# and libdave on a plain runner and installs the same toolchain with the
# upstream script. The image tag must match this version, which the
# containerized jobs verify.
env:
  MOONBIT_INSTALL_VERSION: "0.10.14+7d59c7ec9"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.14-7d59c7ec9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 zlib1g-dev

      - name: Version
        run: |
          moon version --all
          # The image tag and MOONBIT_INSTALL_VERSION must name the same toolchain.
          moon version --all | grep -F -- "$MOONBIT_INSTALL_VERSION"

      - name: Update registry index
        run: moon update

      - name: Type check
        run: moon check --target native --deny-warn

      - name: Test with coverage
        run: |
          moon test --target native --enable-coverage
          moon coverage report -f summary

      - name: Format check
        run: |
          moon fmt --check
          moon -C template fmt --check

      - name: Check nested modules
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          moon work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/template"
          moon check "$GITHUB_WORKSPACE/template/src/main" --target native --deny-warn

      - name: Public API drift check
        run: |
          # The container's git sees a checkout owned by another user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          moon info --target native
          # Current moon removes a legacy trailing blank line from generated
          # interfaces; ignore blank-only churn while still rejecting API edits.
          git diff --exit-code --ignore-blank-lines -- '*.mbti'

      - name: Generated extend declarations check
        run: python3 scripts/gen_extends.py --check

      - name: Audit CDN endpoint baseline
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            "https://raw.githubusercontent.com/discord/discord-api-docs/$(cat scripts/discord-docs-commit)/developers/reference.mdx" \
            --output "$RUNNER_TEMP/discord-reference.mdx"
          moon run scripts/docs_cdn_audit.mbtx "$RUNNER_TEMP/discord-reference.mdx" --self-test

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.14-7d59c7ec9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip

      - name: Version
        run: |
          moon version --all
          # The image tag and MOONBIT_INSTALL_VERSION must name the same toolchain.
          moon version --all | grep -F -- "$MOONBIT_INSTALL_VERSION"

      - name: Update registry index
        run: moon update

      - name: Type check
        run: moon check --target js --deny-warn

      - name: Test native prebuild
        run: node --test test/*.test.js

      - name: Test
        run: moon test --target js

      - name: Install Workers test dependencies
        working-directory: src/examples/workers_echo
        run: npm ci

      - name: Test Cloudflare Worker
        working-directory: src/examples/workers_echo
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm test

      - name: Check Cloudflare Worker bundle
        working-directory: src/examples/workers_echo
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run bundle:check -- --outdir "$RUNNER_TEMP/workers-echo"

      - name: Install Deno 2.5.0
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://dl.deno.land/release/v2.5.0/deno-x86_64-unknown-linux-gnu.zip \
            --output "$RUNNER_TEMP/deno.zip"
          echo '4561adb06b13f287a3785276cb29f377b7ffb49d54290178223b037e161446d3  '"$RUNNER_TEMP/deno.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/deno.zip" -d "$RUNNER_TEMP/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"

      - name: Test Deno interaction adapter
        run: |
          moon build src/examples/interactions_js --target js --release --deny-warn
          deno test --allow-net src/examples/deno_echo/entry.test.js

      - name: Test shared interactions on Node.js
        run: |
          node src/examples/interactions_js/runtime.test.mjs
          node --test src/examples/vercel_echo/adapter.test.mjs
          node --test src/examples/fastly_echo/adapter.test.mjs
          node --test src/examples/lambda_url_echo/adapter.test.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Test shared interactions on Bun
        run: |
          bun src/examples/interactions_js/runtime.test.mjs
          bun test src/examples/bun_echo/entry.test.js

      - name: Install Workers gateway test dependencies
        working-directory: src/examples/workers_gateway
        run: npm ci

      - name: Test Cloudflare Workers gateway
        working-directory: src/examples/workers_gateway
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm test

      - name: Check Cloudflare Workers gateway bundle
        working-directory: src/examples/workers_gateway
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run bundle:check -- --outdir "$RUNNER_TEMP/workers-gateway"

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.14-7d59c7ec9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: |
          moon version --all
          # The image tag and MOONBIT_INSTALL_VERSION must name the same toolchain.
          moon version --all | grep -F -- "$MOONBIT_INSTALL_VERSION"

      - name: Update registry index
        run: moon update

      - name: Type check Wasm
        run: |
          moon check --target wasm --deny-warn
          # Explicit roots must not silently disappear through target filtering.
          moon check src src/coordinator src/endpoint_http src/testkit --target wasm --deny-warn

      - name: Test Wasm including HTTP and TCP loopback
        run: moon test --target wasm --release --verbose

      - name: Build HTTP interactions example
        run: moon build src/examples/interactions_http --target wasm --release --deny-warn

  spin-component:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/gaato/moonbit:0.10.14-7d59c7ec9

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Spin and wasm-tools
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://github.com/spinframework/spin/releases/download/v4.1.0/spin-v4.1.0-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/spin.tar.gz"
          echo 'aeeb892f94cf861f5302546faa0bdaa82cc4be30539621299746a6dc011f3b5a  '"$RUNNER_TEMP/spin.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/spin"
          tar -xzf "$RUNNER_TEMP/spin.tar.gz" -C "$RUNNER_TEMP/spin"
          echo "$RUNNER_TEMP/spin" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo 'f0df9428792225322e9b4344ca581f03b1740d509d6bdad33d14a810009be9ec  '"$RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-tools-1.246.2-x86_64-linux" >> "$GITHUB_PATH"

      - name: Build and test Spin component
        run: |
          moon update
          moon -C experiments/spin_interactions check --target wasm --deny-warn
          moon -C experiments/spin_interactions fmt --check
          moon -C experiments/spin_interactions build --target wasm --release --deny-warn
          wasm-tools component embed experiments/spin_interactions/wit \
            experiments/spin_interactions/_build/wasm/release/build/gaato/spin-discord/gen/gen.wasm \
            --world wasi:http/discord --encoding utf16 \
            --output "$RUNNER_TEMP/discord-embedded.wasm"
          mkdir -p experiments/spin_interactions/target
          wasm-tools component new "$RUNNER_TEMP/discord-embedded.wasm" \
            --output experiments/spin_interactions/target/discord.component.wasm
          node --test experiments/spin_interactions/test.mjs

  voice-shim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISCORD_VOICE_SHIM_PATH: ${{ github.workspace }}/voice-shim/target/release/libdiscord_voice_shim.so
      DISCORD_VOICE_REQUIRE_SHIM: "1"
      MBT_DAVE_REQUIRE_NATIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voice-shim/target
          key: voice-shim-ci-${{ runner.os }}-${{ hashFiles('voice-shim/Cargo.toml', 'voice-shim/Cargo.lock') }}

      - name: Check transport-only voice shim
        working-directory: voice-shim
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build voice shim
        working-directory: voice-shim
        run: cargo build --release --locked

      - name: Install MoonBit
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://cli.moonbitlang.com/install/unix.sh \
            --output "$RUNNER_TEMP/install-moonbit.sh"
          actual="$(shasum -a 256 "$RUNNER_TEMP/install-moonbit.sh" | awk '{print $1}')"
          test "$actual" = "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Version
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Test with transport shim and official libdave
        run: moon test --target native --release --deny-warn

  template-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the template image
        run: |
          # Build against the library in this commit, not the registry: a
          # release commit pins a version that is published only after CI.
          stage="$RUNNER_TEMP/template-image"
          cp -r template "$stage"
          mkdir "$stage/discord"
          git archive HEAD | tar -x -C "$stage/discord"
          printf 'members = [\n  ".",\n  "discord",\n]\n' > "$stage/moon.work"
          docker build --tag discord-bot-template "$stage"

      - name: Start the image without a token
        run: |
          # The executable must load on the distroless base and stop on the
          # missing token rather than on a missing shared library.
          set +e
          output="$(docker run --rm -e DISCORD_TOKEN= discord-bot-template 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -q 'AppConfigError.EmptyToken' <<<"$output"
