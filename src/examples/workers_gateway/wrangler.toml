name = "discord-mbt-workers-gateway"
main = "entry.js"
compatibility_date = "2026-07-14"

[build]
command = "moon build --target js --release --deny-warn ."

[vars]
DISCORD_GATEWAY_URL = "wss://gateway.discord.gg"

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "GatewayShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayShard"]

[triggers]
crons = ["*/5 * * * *"]
